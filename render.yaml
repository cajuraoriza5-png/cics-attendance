services:
  # Python Face Recognition Service (LBPH + Fisherfaces)
  - type: web
    name: cics-attendance-python
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn face_server:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PORT
        value: 5001

databases:
  - name: cics-attendance-db
    databaseName: attendance
    user: attendance_user
    plan: free

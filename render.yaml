services:
  # PHP Web Service
  - type: web
    name: cics-attendance-php
    env: php
    plan: free
    buildCommand: composer install --no-dev --optimize-autoloader || true
    startCommand: php -S 0.0.0.0:10000 -t .
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cics-attendance-db
          property: connectionString
      - key: PYTHON_SERVICE_URL
        value: https://cics-attendance-python.onrender.com
      - key: APP_ENV
        value: production

  # Python Face Recognition Service (LBPH + Fisherfaces)
  - type: web
    name: cics-attendance-python
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn face_server:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PORT
        value: 5001

databases:
  - name: cics-attendance-db
    databaseName: attendance
    user: attendance_user
    plan: free
